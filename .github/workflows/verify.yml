name: Verify SkillBridge

on:
  push:
  pull_request:

jobs:
  build-and-db-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_pass_123
          MYSQL_DATABASE: skillbridge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_pass_123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Configure temporary test databases
        run: |
          cat > .env <<'EOF'
          PORT=3001
          APP_ORIGIN=http://127.0.0.1:3001
          MYSQL_HOST=127.0.0.1
          MYSQL_PORT=3306
          MYSQL_USER=root
          MYSQL_PASSWORD=test_pass_123
          MYSQL_DATABASE=skillbridge
          MONGODB_URI=mongodb://127.0.0.1:27017
          MONGODB_DATABASE=skillbridge
          NODE_ENV=development
          EOF
      - name: Initialize seeded databases
        run: npm run demo:setup
      - name: Verify database schema and indexes
        run: npm run db:verify
      - name: Run full API integration checks
        run: npm run test:integration
